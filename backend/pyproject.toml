[project]
name = "custom-crm-backend"
version = "0.1.0"
description = "FastAPI backend for custom CRM"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.28,<1.0",

    "sqlmodel>=0.0.16,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "greenlet>=3.0,<4.0",

    "alembic>=1.13,<2.0",

    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",

    "structlog>=24.1,<25.0",
    "python-json-logger>=2.0,<3.0",

    "prometheus-client>=0.20,<1.0",

    "bcrypt>=4.0,<6.0",
    "python-jose>=3.3,<4.0",

    "orjson>=3.9,<4.0",

    "aiosmtplib>=3.0,<4.0",

    "python-multipart>=0.0.9,<1.0"
]

[dependency-groups]
dev = [
    "ruff>=0.3,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "pytest-cov>=4.0,<5.0"
]

worker = [
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
