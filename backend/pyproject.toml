[project]
name = "custom-crm-backend"
version = "0.1.0"
description = "FastAPI backend for custom CRM"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.28,<1.0",

    "sqlmodel>=0.0.16,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "greenlet>=3.0,<4.0",

    "alembic>=1.13,<2.0",

    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",

    "structlog>=24.1,<25.0",
    "python-json-logger>=2.0,<3.0",

    "prometheus-client>=0.20,<1.0",

    "bcrypt>=4.0,<6.0",
    "python-jose>=3.3,<4.0",

    "orjson>=3.9,<4.0",

    "aiosmtplib>=3.0,<4.0",

    "python-multipart>=0.0.9,<1.0",

    "twilio>=9.0,<10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "pytest-cov>=4.0,<5.0"
]

worker = [
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic autogenerates revision files; their long one-liners reflect the
# column shapes they mirror, so linting them produces noise without signal.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# alembic/env.py massages sys.path before importing app.* and imports app.models
# purely for its side effect of registering every SQLModel with the shared
# metadata. Both are intentional, so silence the rules that disagree.
"alembic/env.py" = ["E402", "F401"]
# Package __init__.py files are intentional re-export barrels (`from .x import Y`)
# that define the public surface of app.models / app.schemas. Every import there
# is "unused" from ruff's perspective but used by the rest of the codebase.
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's canonical dependency-injection pattern uses these helpers as
# parameter defaults (def route(user = Depends(get_user))). They are safe by
# design; teaching bugbear about them is the standard fix rather than adding
# per-line noqas to every route handler.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
