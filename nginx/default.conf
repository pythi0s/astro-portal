upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:5173;
}

upstream frontend_react_upstream {
    server frontend-react:5174;
}

# Reverse-proxying the React frontend at /app/ requires matching configuration
# on both sides of the wire. Operators enable this by setting VITE_BASE=/app/
# in .env; the React container will then boot Vite with `base: '/app/'` so
# every asset URL (including the HMR websocket path) lives under /app/.
# Without VITE_BASE, requests to /app/ will 404 because Vite defaults to
# `base: '/'`.

server {
    listen 80;
    server_name ${DOMAIN:-localhost};

    # Redirect HTTP to HTTPS when certs are available
    # Uncomment below when SSL is configured:
    # return 301 https://$host$request_uri;

    # React app at /app/ (opt-in; requires VITE_BASE=/app/ in .env). The
    # trailing slash + proxy_pass trailing slash are both required so that
    # /app/foo becomes /app/foo on the upstream (Vite dev server has its
    # own /app/ base and expects the full path, not a rewritten one).
    # Upgrade + Connection headers carry the HMR websocket handshake.
    location /app/ {
        proxy_pass http://frontend_react_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location /uploads/ {
        proxy_pass http://backend_upstream/uploads/;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend_upstream/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }
}

