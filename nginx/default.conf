upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:5173;
}

# NOTE: reverse-proxying the React frontend under a subpath (e.g. /app/)
# requires both vite.config.ts `base: '/app/'` and matching rewrites here.
# Until that two-sided change is made and runtime-verified, the React app is
# intentionally reachable only on its direct port :5174 even under the
# with-nginx profile.

server {
    listen 80;
    server_name ${DOMAIN:-localhost};

    # Redirect HTTP to HTTPS when certs are available
    # Uncomment below when SSL is configured:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location /uploads/ {
        proxy_pass http://backend_upstream/uploads/;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend_upstream/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }
}

