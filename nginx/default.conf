# =============================================================================
# Astro Portal — nginx reverse proxy
# =============================================================================
# Dev (docker-compose.yml --profile with-nginx):
#   HTTP only on port 80. Certs not required.
#
# Production (docker-compose.prod.yml — nginx starts automatically):
#   HTTP on port 80 redirects to HTTPS.
#   HTTPS on port 443 with TLS 1.2/1.3, HSTS, and security headers.
#   To activate HTTPS:
#     1. Place fullchain.pem + privkey.pem in ./nginx/ssl/
#     2. Set DOMAIN=yourdomain.com in .env.production
#     3. Uncomment the 443 server block below.
#
# React frontend: served from port 3000 inside production image,
#                 and from 5174 in the dev Vite server.
# =============================================================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# Production: container-internal nginx on 3000 (static Vite bundle).
# Dev fallback: Vite dev server on 5174.
upstream frontend_upstream {
    server frontend:3000;
}

# =============================================================================
# HTTP server
# =============================================================================
server {
    listen 80;
    server_name _;

    # ── In production: redirect all HTTP → HTTPS ──────────────────────────────
    # Uncomment this block and comment out the locations below once certs exist.
    # return 301 https://$host$request_uri;

    # ── ACME challenge pass-through (Let's Encrypt HTTP-01) ──────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Security headers (applied even over HTTP for dev) ────────────────────
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "1; mode=block"    always;

    # ── React SPA (root — production static or dev Vite) ─────────────────────
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Backend API ───────────────────────────────────────────────────────────
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
        proxy_read_timeout 120s;
    }

    # ── Uploaded files ────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend_upstream/uploads/;
        proxy_set_header Host $host;
        # Uploaded files are immutable once saved; cache aggressively in browser
        add_header Cache-Control "public, max-age=31536000" always;
    }

    # ── FastAPI docs (dev / internal use) ────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # ── Health probe (used by AWS/GCP load balancers at the edge) ────────────
    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
        access_log off;
    }
}

