# Minimal nginx config for serving the React SPA bundle.
# Installed inside the production Docker image at:
#   /etc/nginx/conf.d/default.conf
#
# All unknown routes serve index.html so the React Router can handle them.
# /api/* calls are NOT proxied here — they go through the outer nginx reverse
# proxy at the compose level (nginx/default.conf).

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets that Vite generated (gzip + brotli)
    gzip_static on;

    # SPA fallback: anything that is not a real file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-bust: assets with content hash in the filename get a far-future TTL
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Do not cache the HTML shell (it contains the asset hash references)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health probe for the compose healthcheck
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
        access_log off;
    }
}
