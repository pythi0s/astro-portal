<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1b1626" />
    <script>
      // Apply the saved theme (dark by default) before first paint to avoid a light flash.
      (function () {
        var dark = true;
        try {
          dark = localStorage.getItem('astro_theme') !== 'light';
        } catch (e) {}
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>व्यंकटेश प्रतिष्ठाण</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
